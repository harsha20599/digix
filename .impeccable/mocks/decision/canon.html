<!doctype html>
<html><head><meta charset="utf-8"><title>Digix, Clean Material You</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#FDFBFF;font-family:Roboto,sans-serif;color:#1B1B1F;display:flex;flex-direction:column}
.status{height:44px;padding:14px 24px 0;display:flex;justify-content:space-between;font-size:13px;font-weight:500}
.bar{height:64px;padding:0 20px;display:flex;align-items:center}
.bar h1{font-size:28px;font-weight:400}
.card{margin:8px 16px;background:#D7E3FF;border-radius:28px;padding:22px 24px;display:flex;justify-content:space-between;align-items:center}
.card b{display:block;font-size:28px;font-weight:400}.card span{font-size:14px;color:#3A4560;display:block;margin-top:4px}
.sw{width:52px;height:32px;border-radius:16px;background:#3F5F90;padding:4px;display:flex;justify-content:flex-end}
.sw b{width:24px;height:24px;border-radius:12px;background:#fff}
.head{padding:20px 24px 8px;font-size:22px}
.item{display:flex;gap:16px;align-items:center;padding:12px 24px}
.ic{width:48px;height:48px;border-radius:24px;background:#E8EDF7;display:grid;place-items:center;font-size:13px;font-weight:500;color:#3F5F90}
.tx b{display:block;font-size:16px;font-weight:400}.tx span{font-size:14px;color:#5B5E66}
.warn{color:#8C4A00}
nav{margin-top:auto;height:80px;background:#EFF1F8;display:flex;justify-content:space-around;align-items:center;font-size:12px;font-weight:500;padding-bottom:8px}
nav div:before{content:"";display:block;width:56px;height:30px;border-radius:15px;margin:0 auto 4px}
nav .on:before{background:#D7E3FF}
</style></head><body>
<div class="status"><span>9:41</span><span>5G</span></div>
<div class="bar"><h1>Digix</h1></div>
<div class="card"><div><b>On</b><span>Your watch can run these codes.</span></div><div class="sw"><b></b></div></div>
<div class="head">Your codes</div>
<div class="item"><div class="ic">0101</div><div class="tx"><b>Hotspot</b><span>Ran 2 hours ago</span></div></div>
<div class="item"><div class="ic">0102</div><div class="tx"><b>Find my phone</b><span>Rings even on silent</span></div></div>
<div class="item"><div class="ic">0103</div><div class="tx"><b>Flashlight</b><span>Ran yesterday</span></div></div>
<div class="item"><div class="ic">0104</div><div class="tx"><b>Wi-Fi</b><span class="warn">Needs one more step</span></div></div>
<div class="item"><div class="ic">0105</div><div class="tx"><b>Do Not Disturb</b><span>Not used yet</span></div></div>
<nav><div class="on">Codes</div><div>Activity</div><div>Settings</div></nav>
</body></html>
